# Linux 上编不出 iOS 应用——这是 Apple 的 SDK/签名闭包决定的，不是工具链问题。
# 正确做法：把"需要 macOS"的那一段交给 GitHub 的 macOS runner，本地/Linux 只做纯 Dart 校验。
#
# 本流水线两档：
#   1) dart-analyze (ubuntu)  —— 纯 Dart 部分（wire.dart / probe.dart / bin），秒级，拦类型错误
#   2) ios-nocodesign (macos) —— Flutter iOS 真编译，但**不签名**，只验证能编过
#
# 免费额度：公开仓库不限；私有仓库 macOS runner 计费倍率高于 Linux，按需开启。
name: ios-dart

concurrency:
  group: ios-dart-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'probe/ios-connect/**'
      - '.github/workflows/ios-dart.yml'
  workflow_dispatch:

jobs:
  dart-analyze:
    name: Dart 静态分析（纯 Dart 部分）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: 只分析不依赖 flutter 的文件
        working-directory: probe/ios-connect
        run: |
          dart --version
          # 完整工程依赖 flutter SDK，这里用"最小 pubspec"隔离纯 Dart 子集：
          # 只要 wire.dart / probe.dart 仍然不 import flutter，就能这样验。
          mkdir -p /tmp/dartonly/lib/src /tmp/dartonly/bin
          cp lib/src/wire.dart lib/src/probe.dart /tmp/dartonly/lib/src/
          cp bin/probe.dart /tmp/dartonly/bin/
          cp pubspec.yaml /tmp/dartonly/pubspec.dartonly
          cd /tmp/dartonly
          cat > pubspec.yaml <<'YAML'
          name: ios_connect_probe
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            crypto: ^3.0.3
          YAML
          dart pub get
          dart analyze --fatal-infos

  ios-nocodesign:
    name: Flutter iOS 编译（macOS runner，不签名）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter doctor
        run: flutter doctor -v
      # 仓库里只有 lib/ 与 bin/，没有 ios/ 工程壳（在 Linux 上生成不了）。
      # macOS runner 自带 Flutter SDK，所以在这一步补齐：它只新增 ios/ 等平台目录，
      # 不动已有的 lib/ 与 pubspec.yaml 的依赖段。
      - name: 生成 iOS 工程壳
        working-directory: probe/ios-connect
        run: |
          flutter create --platforms=ios --org com.crossdesk --project-name ios_connect_probe .
          echo "--- 生成后的 ios/ 结构 ---"
          ls -la ios/ || true
          # NetBird userspace 需要访问本地网络，iOS 14+ 必须声明用途
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'crossdesk 需要访问本地网络以建立 NetBird 隧道'" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" ios/Runner/Info.plist || true
      # 注：`flutter build ios --no-codesign` 在 Flutter 3.47 上**仍会**要求
      # Development Team（实测报 "requires a selected Development Team with a
      # Provisioning Profile"），尽管 Xcode build 已经成功了 28 秒。
      # 所以这里只让 flutter 生成配置，真正的编译交给 xcodebuild 并把签名全关掉。
      # 本地拿不到 flutter_netbird 的完整包（pub 的 33MB tarball 在国内镜像上被截断），
      # 所以让 CI 把它真实的 Dart API 打出来，我们按真签名改 netbird_bridge.dart。
      - name: 导出 flutter_netbird 真实 API
        working-directory: probe/ios-connect
        continue-on-error: true
        run: |
          set +e
          flutter pub get >/dev/null 2>&1
          F=$(find "$HOME/.pub-cache" -path '*flutter_netbird-1.0.5/lib/flutter_netbird.dart' | head -1)
          echo "=== 源码文件: $F ==="
          echo "--- 顶层类型 ---"
          grep -nE '^(class|abstract class|enum|typedef|mixin|extension) ' "$F" | head -80
          echo "--- 静态方法 ---"
          grep -nE '^\s+static .*[\(;]' "$F" | head -60
          echo "--- NetbirdAuth 构造 ---"
          grep -nA6 'class NetbirdAuth' "$F" | head -20
          echo "--- NetbirdConfig 构造 ---"
          grep -nA18 'class NetbirdConfig' "$F" | head -34
          echo "--- HttpOverrides / proxy 相关 ---"
          grep -niE 'httpoverrides|Future<int>|startProxy|proxyPort' "$F" | head -25
          echo "--- NetbirdSDK 实例方法签名 ---"
          grep -nE '^  (Future|void|int|bool|String|Map|List|Stream|NetbirdSDK)[^;]*\(' "$F" | head -50
          echo "--- NetbirdSDK 类体原文 105-268 ---"
          sed -n '105,268p' "$F" | grep -vE '^\s*///|^\s*//' | head -120
      - name: 清空 DEVELOPMENT_TEAM（免费账号/CI 上都没有 team）
        working-directory: probe/ios-connect
        run: |
          PBX=ios/Runner.xcodeproj/project.pbxproj
          grep -c 'DEVELOPMENT_TEAM' "$PBX" || true
          sed -i '' -E 's/DEVELOPMENT_TEAM = [^;]+;/DEVELOPMENT_TEAM = "";/g' "$PBX"
          grep -n 'DEVELOPMENT_TEAM' "$PBX" | head -5 || true
      # 回到 flutter build：它会自动跑 pod install（把 flutter_netbird 的原生库链进来），
      # 这一点是 xcodebuild 直编做不到的——第一版 ipa 因此缺 Frameworks/flutter_netbird.framework。
      # 签名问题已由上一步「清空 DEVELOPMENT_TEAM」解决。
      - name: 编译（flutter build ios，自动 pod install，不签名）
        working-directory: probe/ios-connect
        run: |
          flutter pub get
          flutter build ios --no-codesign --release
          echo "--- 产物 ---"
          ls -la build/ios/iphoneos/ || true
          echo "--- 插件原生库是否链进来 ---"
          ls build/ios/iphoneos/Runner.app/Frameworks/ || true
      - name: 产物信息
        working-directory: probe/ios-connect
        run: |
          APP=build/ios/iphoneos/Runner.app
          echo "APP=$APP"
          ls -la "$APP" | head -20 || true
          du -sh "$APP" || true
          echo "--- 架构 ---"
          lipo -info "$APP/Runner" || true
      - uses: actions/upload-artifact@v4
        with:
          name: Runner-nocodesign
          path: probe/ios-connect/build/ios/iphoneos/Runner.app
          if-no-files-found: warn
